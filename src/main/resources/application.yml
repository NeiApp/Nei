vaadin:
  launch-browser: false
spring:
  application:
    name: Nei

  #h2-console
  h2:
    enabled: true
    path: /h2-console
    settings:
      web-allow-others: false

# TODO(roadmap #1): in-memory H2 wipes ALL data on every restart. Use a file database (H2 file mode or SQLite).
 #datasource
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password

 #jpa
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 4000